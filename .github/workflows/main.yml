name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Trust Headscale CA
        shell: pwsh
        env:
          CA: ${{ secrets.HEADSCALE_CA_CERT }}
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'headscale-ca.crt'
          [IO.File]::WriteAllText($p, $env:CA)
          Import-Certificate -FilePath $p -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Write-Host "Headscale CA trusted."

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name SecurityLayer -Value 0
          netsh advfirewall firewall add rule name="RDP-3389" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Write-Host "RDP enabled."

      - name: Create RDP user (fixed password)
        shell: pwsh
        env:
          RU: ${{ secrets.RDP_USERNAME }}
          RP: ${{ secrets.RDP_PASSWORD }}
        run: |
          $sec = ConvertTo-SecureString $env:RP -AsPlainText -Force
          if (Get-LocalUser -Name $env:RU -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $env:RU -Password $sec
          } else {
            New-LocalUser -Name $env:RU -Password $sec -AccountNeverExpires -PasswordNeverExpires
          }
          Add-LocalGroupMember -Group 'Administrators' -Member $env:RU -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:RU -ErrorAction SilentlyContinue
          Write-Host "RDP user ready."

      - name: Install Tailscale
        shell: pwsh
        run: |
          choco install tailscale -y --no-progress | Out-Null
          $ts = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (-not (Test-Path $ts)) { Write-Error "tailscale.exe not found after install"; exit 1 }
          Write-Host "Tailscale installed."

      - name: Join Headscale mesh
        shell: pwsh
        env:
          HS: ${{ secrets.HEADSCALE_URL }}
          AK: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ts = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep 3
          & $ts up --login-server=$env:HS --authkey=$env:AK --hostname=rdp-runner --accept-dns=false --unattended
          $ip = $null; $tries = 0
          while (-not $ip -and $tries -lt 30) {
            Start-Sleep 5
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            $tries++
          }
          if (-not $ip) { Write-Error "No mesh IP assigned by Headscale"; exit 1 }
          Write-Host "================ RDP READY ================"
          Write-Host ("mesh IP : {0}" -f $ip)
          Write-Host "Reach it through the EC2 public relay; the password is a repo secret."
          Write-Host "==========================================="

      - name: Checkout repo (mirror worker)
        uses: actions/checkout@v4

      - name: Start GitHub mirror worker (background, 15 parallel)
        shell: pwsh
        env:
          SB_HOST: ${{ secrets.N8N_DB_HOST }}
          SB_PORT: ${{ secrets.N8N_DB_PORT }}
          SB_DB: ${{ secrets.N8N_DB_NAME }}
          SB_USER: ${{ secrets.N8N_DB_USER }}
          SB_PASSWORD: ${{ secrets.N8N_DB_PASSWORD }}
          MIRROR_PARALLEL: "15"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          cd mirror-worker
          npm install pg --no-audit --no-fund | Out-Null
          $p = Start-Process -FilePath "node" -ArgumentList "mirror_worker.js" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\mirror.out.log" -RedirectStandardError "$env:RUNNER_TEMP\mirror.err.log"
          Start-Sleep 25
          Write-Host ("mirror worker launched, PID {0}. First output:" -f $p.Id)
          if (Test-Path "$env:RUNNER_TEMP\mirror.out.log") { Get-Content "$env:RUNNER_TEMP\mirror.out.log" -Tail 20 }
          if (Test-Path "$env:RUNNER_TEMP\mirror.err.log") { Get-Content "$env:RUNNER_TEMP\mirror.err.log" -Tail 20 }

      - name: Keep alive (exit before 6h kill)
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(355)
          while ((Get-Date) -lt $deadline) {
            Write-Host ("[{0}] runner alive" -f (Get-Date -Format o))
            Start-Sleep -Seconds 300
          }
          Write-Host "Approaching 6h limit; exiting so the next runner takes over."
