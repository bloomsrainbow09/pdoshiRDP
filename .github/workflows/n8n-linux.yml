name: n8n

on:
  workflow_dispatch:

jobs:
  n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # This workflow never checked out the repo — it only ever needed secrets and Docker
      # images. The agent is code, and it is bind-mounted into its container from
      # $GITHUB_WORKSPACE/agent, so the checkout is now load-bearing. ~6 MB.
      - name: Checkout (the agent lives in this repo)
        uses: actions/checkout@v4

      - name: Trust Headscale CA + join mesh
        env:
          CA: ${{ secrets.HEADSCALE_CA_CERT }}
          HS: ${{ secrets.HEADSCALE_URL }}
          AK: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "$CA" | sudo tee /usr/local/share/ca-certificates/headscale.crt >/dev/null
          sudo update-ca-certificates
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --login-server="$HS" --authkey="$AK" --hostname=rdp-runner --accept-dns=false
          ip=""
          for i in $(seq 1 30); do ip=$(sudo tailscale ip -4 2>/dev/null); [ -n "$ip" ] && break; sleep 3; done
          [ -n "$ip" ] || { echo "no mesh IP"; exit 1; }
          echo "mesh IP: $ip"

      - name: Run n8n (Docker, Supabase-backed)
        env:
          SB_HOST: ${{ secrets.SB_HOST }}
          SB_PORT: ${{ secrets.SB_PORT }}
          SB_DB: ${{ secrets.SB_DB }}
          SB_USER: ${{ secrets.SB_USER }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          KILOCODE_TOKEN: ${{ secrets.KILOCODE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DBH: ${{ secrets.N8N_DB_HOST }}
          DBP: ${{ secrets.N8N_DB_PORT }}
          DBN: ${{ secrets.N8N_DB_NAME }}
          DBU: ${{ secrets.N8N_DB_USER }}
          DBPW: ${{ secrets.N8N_DB_PASSWORD }}
          DBS: ${{ secrets.N8N_DB_SCHEMA }}
          ENCKEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          JWT: ${{ secrets.N8N_JWT_SECRET }}
          WHURL: ${{ secrets.N8N_WEBHOOK_URL }}
          BLTOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          CHROME_USER: ${{ secrets.CHROME_USER }}
          CHROME_PASS: ${{ secrets.CHROME_PASS }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_PROFILE_FOLDER: ${{ secrets.GDRIVE_PROFILE_FOLDER }}
          PROFILE_ENC_PASSPHRASE: ${{ secrets.PROFILE_ENC_PASSPHRASE }}
          PROFILE_GIT_USER: ${{ secrets.PROFILE_GIT_USER }}
          PROFILE_GIT_TOKEN: ${{ secrets.PROFILE_GIT_TOKEN }}
        run: |
          echo "== start Browserless (self-hosted headless Chrome) =="
          docker network create n8nnet 2>/dev/null || true
          docker run -d --name browserless --restart unless-stopped --network n8nnet \
            -e "TOKEN=$BLTOKEN" -e "CONCURRENT=3" -e "TIMEOUT=120000" -e "QUEUED=10" \
            ghcr.io/browserless/chromium:latest
          echo "== restore Chrome profile from Drive (if a backup exists) =="
          mkdir -p "$HOME/chrome-config"
          gdrive_token() {
            curl -s -X POST https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=$GDRIVE_CLIENT_ID" \
              --data-urlencode "client_secret=$GDRIVE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$GDRIVE_REFRESH_TOKEN" \
              --data-urlencode "grant_type=refresh_token" | jq -r '.access_token // empty'
          }
          restore_profile() {
            local acc fid
            acc=$(gdrive_token); [ -n "$acc" ] || { echo "  no Drive token"; return 1; }
            fid=$(curl -s -H "Authorization: Bearer $acc" \
              "https://www.googleapis.com/drive/v3/files?q='$GDRIVE_PROFILE_FOLDER'+in+parents+and+name='chrome-profile.tar.gz.enc'+and+trashed=false&fields=files(id)" \
              | jq -r '.files[0].id // empty')
            [ -n "$fid" ] || { echo "  no saved profile in Drive yet -> fresh start"; return 1; }
            curl -s -H "Authorization: Bearer $acc" "https://www.googleapis.com/drive/v3/files/$fid?alt=media" -o /tmp/profile.enc || return 1
            openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$PROFILE_ENC_PASSPHRASE" -in /tmp/profile.enc -out /tmp/profile.tar.gz 2>/dev/null \
              || { echo "  decrypt failed"; return 1; }
            sudo tar xzf /tmp/profile.tar.gz -C "$HOME/chrome-config" 2>/dev/null \
              && echo "  profile restored ($(sudo du -sh "$HOME/chrome-config" 2>/dev/null | cut -f1))" || { echo "  extract failed"; return 1; }
            rm -f /tmp/profile.enc /tmp/profile.tar.gz
          }
          restore_profile || echo "  -> starting with a fresh Chrome profile"
          sudo chown -R 1000:1000 "$HOME/chrome-config" 2>/dev/null || true
          echo "== fetch IG Post Export extension (always auto-loaded into the viewer) =="
          rm -rf "$HOME/ig-ext"; mkdir -p "$HOME/ig-ext"
          git clone -q --depth 1 "https://${PROFILE_GIT_USER}:${PROFILE_GIT_TOKEN}@github.com/prarthnadoshi/chrome-extensions.git" "$HOME/ig-ext" \
            && echo "  extension fetched ($(ls "$HOME/ig-ext/ig-post-export" 2>/dev/null | wc -l) files)" \
            || echo "  (extension fetch failed; viewer starts without it)"
          sudo chown -R 1000:1000 "$HOME/ig-ext" 2>/dev/null || true
          echo "== start visible Chrome (noVNC viewer + CDP on 9222 + IG extension) =="
          docker run -d --name chromium --restart unless-stopped --network n8nnet \
            --shm-size=2g -p 3000:3000 -p 127.0.0.1:9222:9222 \
            -e PUID=1000 -e PGID=1000 -e TITLE=Reddit-Chrome \
            -e CUSTOM_USER="$CHROME_USER" -e PASSWORD="$CHROME_PASS" \
            -e "CHROME_CLI=--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --remote-allow-origins=* --load-extension=/extensions/ig-post-export --test-type" \
            -v "$HOME/chrome-config":/config \
            -v "$HOME/ig-ext":/extensions:ro \
            lscr.io/linuxserver/chromium:latest
          echo "== prepare cookie-sync (CDP 127.0.0.1:9222 -> Supabase n8n.browser_cookies) =="
          ( cd /tmp && npm i chrome-remote-interface >/dev/null 2>&1 ) && echo "  chrome-remote-interface ready" || echo "  (cri install failed; cookie-sync will skip)"
          docker pull postgres:17-alpine >/dev/null 2>&1 || true
          echo "" | base64 -d > /tmp/getcookies.js
          echo "== start n8n =="
          docker run -d --name n8n --restart unless-stopped --network n8nnet -p 5678:5678 \
            -e DB_TYPE=postgresdb \
            -e DB_POSTGRESDB_HOST="$DBH" \
            -e DB_POSTGRESDB_PORT="$DBP" \
            -e DB_POSTGRESDB_DATABASE="$DBN" \
            -e DB_POSTGRESDB_USER="$DBU" \
            -e DB_POSTGRESDB_PASSWORD="$DBPW" \
            -e DB_POSTGRESDB_SCHEMA="$DBS" \
            -e DB_POSTGRESDB_SSL_ENABLED=true \
            -e DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=false \
            -e N8N_ENCRYPTION_KEY="$ENCKEY" \
            -e N8N_USER_MANAGEMENT_JWT_SECRET="$JWT" \
            -e WEBHOOK_URL="$WHURL" \
            -e N8N_EDITOR_BASE_URL="$WHURL" \
            -e N8N_SECURE_COOKIE=false \
            -e EXECUTIONS_DATA_PRUNE=true \
            -e EXECUTIONS_DATA_MAX_AGE=168 \
            -e EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000 \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e GENERIC_TIMEZONE=Asia/Kolkata -e TZ=Asia/Kolkata \
            docker.n8n.io/n8nio/n8n:latest
          echo "waiting for n8n /healthz..."
          ok=0
          for i in $(seq 1 48); do
            if curl -fsS http://localhost:5678/healthz >/dev/null 2>&1; then echo "n8n UP after ~$((i*5))s"; ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "n8n did not become healthy:"; docker logs --tail 60 n8n || true; exit 1; fi
          docker logs --tail 15 n8n || true
          echo "== verify Browserless on the n8n network =="
          sleep 6
          docker run --rm --network n8nnet curlimages/curl:8.11.0 -fsS --max-time 15 "http://browserless:3000/json/version?token=$BLTOKEN" \
            && echo "  ^ Browserless reachable from n8n network" \
            || { echo "Browserless not answering yet:"; docker logs --tail 15 browserless 2>&1 | head; }
          echo "== visible Chrome (chromium) status =="
          docker ps --filter name=chromium --format '{{.Names}}: {{.Status}}'
          docker logs --tail 8 chromium 2>&1 | head -8 || true

          # ── Telegram -> agent -> email ────────────────────────────────────────────
          # A FOURTH container, started here rather than as its own step, because a step
          # added after "Keep alive" would not begin until t=358 — two minutes before the
          # 360-minute hard cap. The agent has to run CONCURRENTLY with the keep-alive.
          #
          # It does not touch the EC2 in any way: Telegram, Supabase, SMTP and the model
          # providers are all reached directly from this runner, on GitHub's bandwidth.
          # Nothing is relayed through socat and no EC2 egress is added.
          #
          # core/supervisor.py sleeps 720s before connecting. The EC2 dispatches this
          # runner at the previous one's t=350 while that one lives to t≈359 — a measured
          # 9.7-minute overlap — and two clients on one Telegram session can get the auth
          # key REVOKED, which needs a human with a phone to undo. See that file.
          echo "== start the trading agent (4th container) =="
          cat > "$HOME/agent-entry.sh" <<'AGENTEOF'
          set -eu
          cd /app
          echo "installing runtime deps..."
          pip install --quiet --no-cache-dir psycopg2-binary httpx cryptg pyaes rsa
          echo "deps ready; telethon comes from /app/vendor (pinned dab6bc4d)"
          python -c "import telethon,sys;print('telethon',telethon.__version__,'ok')"
          # 330 minutes live. The watcher exits on its own clock and releases the lease,
          # which is what lets the NEXT runner acquire it without waiting out the TTL.
          exec python -m core.supervisor --seconds 19800
          AGENTEOF
          # No dedent needed: GitHub strips the block indentation from a `run: |` body
          # before executing it, so the heredoc lands at column 0 already.
          chmod +x "$HOME/agent-entry.sh"
          docker run -d --name tg-agent --restart unless-stopped --network n8nnet \
            --memory=1g --cpus=1.5 \
            -v "$GITHUB_WORKSPACE/agent":/app:ro \
            -v "$HOME/agent-entry.sh":/entry.sh:ro \
            -e PYTHONPATH=/app:/app/vendor \
            -e PYTHONUNBUFFERED=1 \
            -e VERTICAL=trading             `# No TG_* here. The Telegram session, api_id and api_hash all live in`             `# content.source_accounts and are read from Supabase — the session string`             `# is full account control and never reaches GitHub.` \
            -e TG_API_ID="$TG_API_ID" \
            -e TG_API_HASH="$TG_API_HASH" \
            -e TG_SESSION_STRING="$TG_SESSION_STRING" \
            -e SB_HOST="$SB_HOST" -e SB_PORT="$SB_PORT" -e SB_DB="$SB_DB" \
            -e SB_USER="$SB_USER" -e SB_PASSWORD="$SB_PASSWORD" \
            -e NVIDIA_API_KEY="$NVIDIA_API_KEY" \
            -e NVIDIA_API_KEY_2="$NVIDIA_API_KEY_2" \
            -e ZAI_API_KEY="$ZAI_API_KEY" \
            -e KILOCODE_TOKEN="$KILOCODE_TOKEN" \
            -e SMTP_HOST="$SMTP_HOST" -e SMTP_PORT="$SMTP_PORT" \
            -e SMTP_USER="$SMTP_USER" -e SMTP_PASSWORD="$SMTP_PASSWORD" \
            -e SMTP_FROM="$SMTP_FROM" -e ALERT_TO="$ALERT_TO" \
            python:3.12-slim bash /entry.sh
          sleep 20
          echo "== tg-agent status =="
          docker ps --filter name=tg-agent --format '{{.Names}}: {{.Status}}'
          docker logs --tail 15 tg-agent 2>&1 | head -20 || true

      - name: Keep alive + persist Chrome profile (exit before 6h kill)
        env:
          SB_HOST: ${{ secrets.SB_HOST }}
          SB_PORT: ${{ secrets.SB_PORT }}
          SB_DB: ${{ secrets.SB_DB }}
          SB_USER: ${{ secrets.SB_USER }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_PROFILE_FOLDER: ${{ secrets.GDRIVE_PROFILE_FOLDER }}
          PROFILE_ENC_PASSPHRASE: ${{ secrets.PROFILE_ENC_PASSPHRASE }}
          PROFILE_GIT_REPO: ${{ secrets.PROFILE_GIT_REPO }}
          PROFILE_GIT_USER: ${{ secrets.PROFILE_GIT_USER }}
          PROFILE_GIT_TOKEN: ${{ secrets.PROFILE_GIT_TOKEN }}
          DBH: ${{ secrets.N8N_DB_HOST }}
          DBP: ${{ secrets.N8N_DB_PORT }}
          DBN: ${{ secrets.N8N_DB_NAME }}
          DBU: ${{ secrets.N8N_DB_USER }}
          DBPW: ${{ secrets.N8N_DB_PASSWORD }}
        run: |
          # This is a best-effort monitor + backup loop. GitHub runs steps with `bash -e`,
          # which would let any single non-zero command (a root-owned temp file rm, a curl,
          # a psql) kill the whole run. Disable errexit; the ONLY thing that should end the
          # run is the explicit n8n-unrecoverable `exit 1` or the timer expiring.
          set +e
          gdrive_token() {
            curl -s -X POST https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=$GDRIVE_CLIENT_ID" \
              --data-urlencode "client_secret=$GDRIVE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$GDRIVE_REFRESH_TOKEN" \
              --data-urlencode "grant_type=refresh_token" | jq -r '.access_token // empty'
          }
          # Snapshot the live profile (cookies/logins/localstorage), encrypt, push to Drive (+git on final).
          backup_profile() {  # $1 = "final" -> also force-push to git
            [ -d "$HOME/chrome-config" ] || return 0
            sudo tar czf /tmp/profile.tar.gz --warning=no-file-changed \
              --exclude='*Cache*' --exclude='*Crashpad*' --exclude='*crx_cache*' \
              --exclude='*Service Worker*' --exclude='*.log' \
              -C "$HOME/chrome-config" . 2>/dev/null || true
            [ -s /tmp/profile.tar.gz ] || { echo "  (nothing to back up)"; return 0; }
            openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"$PROFILE_ENC_PASSPHRASE" \
              -in /tmp/profile.tar.gz -out /tmp/profile.enc
            local acc; acc=$(gdrive_token)
            if [ -n "$acc" ]; then
              for old in $(curl -s -H "Authorization: Bearer $acc" \
                  "https://www.googleapis.com/drive/v3/files?q='$GDRIVE_PROFILE_FOLDER'+in+parents+and+name='chrome-profile.tar.gz.enc'+and+trashed=false&fields=files(id)" \
                  | jq -r '.files[].id'); do
                curl -s -X DELETE -H "Authorization: Bearer $acc" "https://www.googleapis.com/drive/v3/files/$old" >/dev/null
              done
              curl -s -X POST "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart" \
                -H "Authorization: Bearer $acc" \
                -F "metadata={\"name\":\"chrome-profile.tar.gz.enc\",\"parents\":[\"$GDRIVE_PROFILE_FOLDER\"]};type=application/json;charset=UTF-8" \
                -F "file=@/tmp/profile.enc;type=application/octet-stream" -o /dev/null \
                && echo "  -> Drive updated ($(du -h /tmp/profile.enc | cut -f1))" || echo "  Drive upload failed"
            else echo "  no Drive token (skip Drive)"; fi
            if [ "$1" = final ] && [ -n "$PROFILE_GIT_TOKEN" ]; then
              local d=/tmp/cp; rm -rf "$d"; mkdir -p "$d"; cp /tmp/profile.enc "$d/chrome-profile.tar.gz.enc"
              ( cd "$d" && git init -q && git checkout -q -b main \
                && git -c user.email=bot@runner -c user.name=runner add . \
                && git -c user.email=bot@runner -c user.name=runner commit -q -m "profile snapshot" \
                && git push -q -f "https://$PROFILE_GIT_USER:$PROFILE_GIT_TOKEN@${PROFILE_GIT_REPO#https://}" main \
                && echo "  -> git updated" || echo "  git push failed" )
            fi
            sudo rm -f /tmp/profile.tar.gz /tmp/profile.enc 2>/dev/null || true
          }
          # Pull the live cookies from the visible Chrome (CDP) and upsert reddit/instagram
          # into Supabase n8n.browser_cookies, so any n8n/HTTP workflow can read the session.
          sync_cookies() {
            [ -f /tmp/getcookies.js ] || return 0
            local json; json=$(NODE_PATH=/tmp/node_modules node /tmp/getcookies.js 2>/dev/null) || return 0
            [ -n "$json" ] && [ "$json" != "{}" ] || { echo "  (no reddit/instagram cookies captured yet)"; return 0; }
            local site cj hdr
            for site in reddit instagram; do
              cj=$(echo "$json" | jq -c --arg s "$site" '.[$s] // empty'); [ -n "$cj" ] || continue
              hdr=$(echo "$cj" | jq -r 'map(.name+"="+.value)|join("; ")')
              printf 'INSERT INTO n8n.browser_cookies(site,cookie_header,cookies_json,updated_at) VALUES($s$%s$s$,$h$%s$h$,$j$%s$j$::jsonb,now()) ON CONFLICT(site) DO UPDATE SET cookie_header=EXCLUDED.cookie_header,cookies_json=EXCLUDED.cookies_json,updated_at=now();' "$site" "$hdr" "$cj" \
                | docker run --rm -i -e PGPASSWORD="$DBPW" postgres:17-alpine psql "host=$DBH port=$DBP dbname=$DBN user=$DBU sslmode=require" >/dev/null 2>&1 \
                && echo "  cookies -> Supabase: $site ($(echo "$cj"|jq 'length') cookies)" || echo "  cookie upsert failed: $site"
            done
          }
          end=$(( $(date +%s) + 355*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            if ! docker ps --format '{{.Names}}' | grep -q '^n8n$'; then
              # n8n has --restart unless-stopped; tolerate a transient blip (e.g. brief
              # overlap with the next runner) instead of failing the whole run.
              echo "[$(date -u +%T)] n8n not running; allowing auto-restart to recover..."
              rec=0
              for r in 1 2 3 4 5 6; do
                sleep 10
                if docker ps --format '{{.Names}}' | grep -q '^n8n$' && curl -fsS http://localhost:5678/healthz >/dev/null 2>&1; then rec=1; break; fi
              done
              if [ "$rec" != 1 ]; then
                docker start n8n 2>/dev/null || true; sleep 15
                if ! curl -fsS http://localhost:5678/healthz >/dev/null 2>&1; then
                  echo "n8n unrecoverable after ~75s:"; docker logs --tail 80 n8n || true; exit 1
                fi
                echo "n8n recovered via restart"
              fi
            fi
            echo "[$(date -u +%T)] n8n alive"
            # tg-agent carries --restart unless-stopped, so Docker revives it after a
            # crash on its own. This only REPORTS, deliberately: the run must not fail
            # because the agent had a bad minute, but a six-hour silence must not be
            # invisible either.
            if docker ps --format '{{.Names}}' | grep -q '^tg-agent$'; then
              echo "[$(date -u +%T)] tg-agent alive"
            else
              echo "[$(date -u +%T)] ! tg-agent NOT running — last 30 lines:"
              docker logs --tail 30 tg-agent 2>&1 | tail -30 || true
            fi
            i=$((i+1))
            if [ $((i % 5)) -eq 0 ]; then echo "[$(date -u +%T)] profile backup + cookie sync..."; backup_profile; sync_cookies; fi
            sleep 120
          done
          echo "approaching 6h; stopping the agent first so it releases the Telegram lease."
          docker stop -t 60 tg-agent 2>/dev/null || true
          docker logs --tail 12 tg-agent 2>&1 | tail -12 || true

          # ── encrypted backup of content/ , from THIS RUNNER ───────────────────────
          # Zero EC2 egress: the dump goes straight from here to Drive. Uses the
          # postgres:17-alpine image the cookie sync already pulls.
          echo "== backing up the content schema =="
          ts=$(date -u +%Y%m%d-%H%M)
          if docker run --rm -e PGPASSWORD="$SB_PASSWORD" postgres:17-alpine \
               pg_dump "host=$SB_HOST port=$SB_PORT dbname=$SB_DB user=$SB_USER sslmode=require" \
               --schema=content --no-owner --no-privileges 2>/dev/null | gzip > /tmp/content.sql.gz; then
            sz=$(stat -c%s /tmp/content.sql.gz)
            if [ "$sz" -gt 1000 ]; then
              openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"$PROFILE_ENC_PASSPHRASE" \
                -in /tmp/content.sql.gz -out /tmp/content.enc
              AT=$(curl -s -X POST https://oauth2.googleapis.com/token \
                    --data-urlencode "client_id=$GDRIVE_CLIENT_ID" \
                    --data-urlencode "client_secret=$GDRIVE_CLIENT_SECRET" \
                    --data-urlencode "refresh_token=$GDRIVE_REFRESH_TOKEN" \
                    --data-urlencode "grant_type=refresh_token" | jq -r '.access_token // empty')
              if [ -n "$AT" ]; then
                # SEARCH THEN CREATE. Under the drive.file scope this app can only reach
                # folders it made itself; trusting a hand-made folder id is what has been
                # failing the EC2's n8n-backup on every run with "resumable init failed".
                FID=$(curl -s -H "Authorization: Bearer $AT" \
                  "https://www.googleapis.com/drive/v3/files?q=name='telegram-agent'+and+'$GDRIVE_FOLDER_ID'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+trashed=false&fields=files(id)" \
                  | jq -r '.files[0].id // empty')
                if [ -z "$FID" ]; then
                  FID=$(curl -s -X POST "https://www.googleapis.com/drive/v3/files?fields=id" \
                    -H "Authorization: Bearer $AT" -H "Content-Type: application/json" \
                    -d "{\"name\":\"telegram-agent\",\"mimeType\":\"application/vnd.google-apps.folder\",\"parents\":[\"$GDRIVE_FOLDER_ID\"]}" | jq -r .id)
                  echo "  created Drive folder telegram-agent ($FID)"
                fi
                curl -s -X POST "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart" \
                  -H "Authorization: Bearer $AT" \
                  -F "metadata={\"name\":\"content-$ts.sql.gz.enc\",\"parents\":[\"$FID\"]};type=application/json;charset=UTF-8" \
                  -F "file=@/tmp/content.enc;type=application/octet-stream" -o /dev/null \
                  && echo "  content-$ts.sql.gz.enc ($(numfmt --to=iec $sz)) -> Drive/telegram-agent" \
                  || echo "  ! Drive upload failed"
                # keep the last 14
                curl -s -H "Authorization: Bearer $AT" \
                  "https://www.googleapis.com/drive/v3/files?q='$FID'+in+parents+and+trashed=false&orderBy=createdTime+desc&fields=files(id,name)" \
                  | jq -r '.files[14:][]?.id' | while read -r old; do
                      curl -s -X DELETE -H "Authorization: Bearer $AT" "https://www.googleapis.com/drive/v3/files/$old" -o /dev/null
                    done
              else
                echo "  ! no Drive token — skipping (git + the EC2 daily dump still cover this)"
              fi
            else
              echo "  ! dump suspiciously small ($sz bytes) — not uploading a truncated backup"
            fi
          else
            echo "  ! pg_dump failed — content is still in the EC2 daily full dump"
          fi
          rm -f /tmp/content.sql.gz /tmp/content.enc
          echo "approaching 6h; final cookie sync + clean profile snapshot, then hand off."
          sync_cookies
          docker stop chromium 2>/dev/null || true
          sleep 2
          backup_profile final
          docker stop n8n || true
