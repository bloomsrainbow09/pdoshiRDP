name: n8n

on:
  workflow_dispatch:

jobs:
  n8n:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Trust Headscale CA + join mesh
        env:
          CA: ${{ secrets.HEADSCALE_CA_CERT }}
          HS: ${{ secrets.HEADSCALE_URL }}
          AK: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          echo "$CA" | sudo tee /usr/local/share/ca-certificates/headscale.crt >/dev/null
          sudo update-ca-certificates
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --login-server="$HS" --authkey="$AK" --hostname=rdp-runner --accept-dns=false
          ip=""
          for i in $(seq 1 30); do ip=$(sudo tailscale ip -4 2>/dev/null); [ -n "$ip" ] && break; sleep 3; done
          [ -n "$ip" ] || { echo "no mesh IP"; exit 1; }
          echo "mesh IP: $ip"

      - name: Run n8n (Docker, Supabase-backed)
        env:
          DBH: ${{ secrets.N8N_DB_HOST }}
          DBP: ${{ secrets.N8N_DB_PORT }}
          DBN: ${{ secrets.N8N_DB_NAME }}
          DBU: ${{ secrets.N8N_DB_USER }}
          DBPW: ${{ secrets.N8N_DB_PASSWORD }}
          DBS: ${{ secrets.N8N_DB_SCHEMA }}
          ENCKEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          JWT: ${{ secrets.N8N_JWT_SECRET }}
          WHURL: ${{ secrets.N8N_WEBHOOK_URL }}
          BLTOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          CHROME_USER: ${{ secrets.CHROME_USER }}
          CHROME_PASS: ${{ secrets.CHROME_PASS }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_PROFILE_FOLDER: ${{ secrets.GDRIVE_PROFILE_FOLDER }}
          PROFILE_ENC_PASSPHRASE: ${{ secrets.PROFILE_ENC_PASSPHRASE }}
        run: |
          echo "== start Browserless (self-hosted headless Chrome) =="
          docker network create n8nnet 2>/dev/null || true
          docker run -d --name browserless --restart unless-stopped --network n8nnet \
            -e "TOKEN=$BLTOKEN" -e "CONCURRENT=3" -e "TIMEOUT=120000" -e "QUEUED=10" \
            ghcr.io/browserless/chromium:latest
          echo "== restore Chrome profile from Drive (if a backup exists) =="
          mkdir -p "$HOME/chrome-config"
          gdrive_token() {
            curl -s -X POST https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=$GDRIVE_CLIENT_ID" \
              --data-urlencode "client_secret=$GDRIVE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$GDRIVE_REFRESH_TOKEN" \
              --data-urlencode "grant_type=refresh_token" | jq -r '.access_token // empty'
          }
          restore_profile() {
            local acc fid
            acc=$(gdrive_token); [ -n "$acc" ] || { echo "  no Drive token"; return 1; }
            fid=$(curl -s -H "Authorization: Bearer $acc" \
              "https://www.googleapis.com/drive/v3/files?q='$GDRIVE_PROFILE_FOLDER'+in+parents+and+name='chrome-profile.tar.gz.enc'+and+trashed=false&fields=files(id)" \
              | jq -r '.files[0].id // empty')
            [ -n "$fid" ] || { echo "  no saved profile in Drive yet -> fresh start"; return 1; }
            curl -s -H "Authorization: Bearer $acc" "https://www.googleapis.com/drive/v3/files/$fid?alt=media" -o /tmp/profile.enc || return 1
            openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$PROFILE_ENC_PASSPHRASE" -in /tmp/profile.enc -out /tmp/profile.tar.gz 2>/dev/null \
              || { echo "  decrypt failed"; return 1; }
            sudo tar xzf /tmp/profile.tar.gz -C "$HOME/chrome-config" 2>/dev/null \
              && echo "  profile restored ($(sudo du -sh "$HOME/chrome-config" 2>/dev/null | cut -f1))" || { echo "  extract failed"; return 1; }
            rm -f /tmp/profile.enc /tmp/profile.tar.gz
          }
          restore_profile || echo "  -> starting with a fresh Chrome profile"
          sudo chown -R 1000:1000 "$HOME/chrome-config" 2>/dev/null || true
          echo "== start visible Chrome (noVNC viewer + CDP on 9222) =="
          docker run -d --name chromium --restart unless-stopped --network n8nnet \
            --shm-size=2g -p 3000:3000 \
            -e PUID=1000 -e PGID=1000 -e TITLE=Reddit-Chrome \
            -e CUSTOM_USER="$CHROME_USER" -e PASSWORD="$CHROME_PASS" \
            -e "CHROME_CLI=--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --remote-allow-origins=*" \
            -v "$HOME/chrome-config":/config \
            lscr.io/linuxserver/chromium:latest
          echo "== start n8n =="
          docker run -d --name n8n --restart unless-stopped --network n8nnet -p 5678:5678 \
            -e DB_TYPE=postgresdb \
            -e DB_POSTGRESDB_HOST="$DBH" \
            -e DB_POSTGRESDB_PORT="$DBP" \
            -e DB_POSTGRESDB_DATABASE="$DBN" \
            -e DB_POSTGRESDB_USER="$DBU" \
            -e DB_POSTGRESDB_PASSWORD="$DBPW" \
            -e DB_POSTGRESDB_SCHEMA="$DBS" \
            -e DB_POSTGRESDB_SSL_ENABLED=true \
            -e DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=false \
            -e N8N_ENCRYPTION_KEY="$ENCKEY" \
            -e N8N_USER_MANAGEMENT_JWT_SECRET="$JWT" \
            -e WEBHOOK_URL="$WHURL" \
            -e N8N_EDITOR_BASE_URL="$WHURL" \
            -e N8N_SECURE_COOKIE=false \
            -e EXECUTIONS_DATA_PRUNE=true \
            -e EXECUTIONS_DATA_MAX_AGE=168 \
            -e EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000 \
            -e N8N_DIAGNOSTICS_ENABLED=false \
            -e GENERIC_TIMEZONE=Asia/Kolkata -e TZ=Asia/Kolkata \
            docker.n8n.io/n8nio/n8n:latest
          echo "waiting for n8n /healthz..."
          ok=0
          for i in $(seq 1 48); do
            if curl -fsS http://localhost:5678/healthz >/dev/null 2>&1; then echo "n8n UP after ~$((i*5))s"; ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "n8n did not become healthy:"; docker logs --tail 60 n8n || true; exit 1; fi
          docker logs --tail 15 n8n || true
          echo "== verify Browserless on the n8n network =="
          sleep 6
          docker run --rm --network n8nnet curlimages/curl:8.11.0 -fsS --max-time 15 "http://browserless:3000/json/version?token=$BLTOKEN" \
            && echo "  ^ Browserless reachable from n8n network" \
            || { echo "Browserless not answering yet:"; docker logs --tail 15 browserless 2>&1 | head; }
          echo "== visible Chrome (chromium) status =="
          docker ps --filter name=chromium --format '{{.Names}}: {{.Status}}'
          docker logs --tail 8 chromium 2>&1 | head -8 || true

      - name: Keep alive + persist Chrome profile (exit before 6h kill)
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_PROFILE_FOLDER: ${{ secrets.GDRIVE_PROFILE_FOLDER }}
          PROFILE_ENC_PASSPHRASE: ${{ secrets.PROFILE_ENC_PASSPHRASE }}
          PROFILE_GIT_REPO: ${{ secrets.PROFILE_GIT_REPO }}
          PROFILE_GIT_USER: ${{ secrets.PROFILE_GIT_USER }}
          PROFILE_GIT_TOKEN: ${{ secrets.PROFILE_GIT_TOKEN }}
        run: |
          gdrive_token() {
            curl -s -X POST https://oauth2.googleapis.com/token \
              --data-urlencode "client_id=$GDRIVE_CLIENT_ID" \
              --data-urlencode "client_secret=$GDRIVE_CLIENT_SECRET" \
              --data-urlencode "refresh_token=$GDRIVE_REFRESH_TOKEN" \
              --data-urlencode "grant_type=refresh_token" | jq -r '.access_token // empty'
          }
          # Snapshot the live profile (cookies/logins/localstorage), encrypt, push to Drive (+git on final).
          backup_profile() {  # $1 = "final" -> also force-push to git
            [ -d "$HOME/chrome-config" ] || return 0
            sudo tar czf /tmp/profile.tar.gz --warning=no-file-changed \
              --exclude='*Cache*' --exclude='*Crashpad*' --exclude='*crx_cache*' \
              --exclude='*Service Worker*' --exclude='*.log' \
              -C "$HOME/chrome-config" . 2>/dev/null || true
            [ -s /tmp/profile.tar.gz ] || { echo "  (nothing to back up)"; return 0; }
            openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"$PROFILE_ENC_PASSPHRASE" \
              -in /tmp/profile.tar.gz -out /tmp/profile.enc
            local acc; acc=$(gdrive_token)
            if [ -n "$acc" ]; then
              for old in $(curl -s -H "Authorization: Bearer $acc" \
                  "https://www.googleapis.com/drive/v3/files?q='$GDRIVE_PROFILE_FOLDER'+in+parents+and+name='chrome-profile.tar.gz.enc'+and+trashed=false&fields=files(id)" \
                  | jq -r '.files[].id'); do
                curl -s -X DELETE -H "Authorization: Bearer $acc" "https://www.googleapis.com/drive/v3/files/$old" >/dev/null
              done
              curl -s -X POST "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart" \
                -H "Authorization: Bearer $acc" \
                -F "metadata={\"name\":\"chrome-profile.tar.gz.enc\",\"parents\":[\"$GDRIVE_PROFILE_FOLDER\"]};type=application/json;charset=UTF-8" \
                -F "file=@/tmp/profile.enc;type=application/octet-stream" -o /dev/null \
                && echo "  -> Drive updated ($(du -h /tmp/profile.enc | cut -f1))" || echo "  Drive upload failed"
            else echo "  no Drive token (skip Drive)"; fi
            if [ "$1" = final ] && [ -n "$PROFILE_GIT_TOKEN" ]; then
              local d=/tmp/cp; rm -rf "$d"; mkdir -p "$d"; cp /tmp/profile.enc "$d/chrome-profile.tar.gz.enc"
              ( cd "$d" && git init -q && git checkout -q -b main \
                && git -c user.email=bot@runner -c user.name=runner add . \
                && git -c user.email=bot@runner -c user.name=runner commit -q -m "profile snapshot" \
                && git push -q -f "https://$PROFILE_GIT_USER:$PROFILE_GIT_TOKEN@${PROFILE_GIT_REPO#https://}" main \
                && echo "  -> git updated" || echo "  git push failed" )
            fi
            rm -f /tmp/profile.tar.gz /tmp/profile.enc
          }
          end=$(( $(date +%s) + 355*60 ))
          i=0
          while [ "$(date +%s)" -lt "$end" ]; do
            if ! docker ps --format '{{.Names}}' | grep -q '^n8n$'; then
              echo "n8n container stopped unexpectedly:"; docker logs --tail 80 n8n || true; exit 1
            fi
            echo "[$(date -u +%T)] n8n alive"
            i=$((i+1))
            if [ $((i % 5)) -eq 0 ]; then echo "[$(date -u +%T)] profile backup..."; backup_profile; fi
            sleep 120
          done
          echo "approaching 6h; clean profile snapshot, then hand off to next runner."
          docker stop chromium 2>/dev/null || true
          sleep 2
          backup_profile final
          docker stop n8n || true
